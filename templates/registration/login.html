{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">

    <h1 style="font-size: 32px; font-weight: 700; color: #111827; margin-bottom: 8px;">
        Вход
    </h1>
    <p style="color: #6b7280; margin-bottom: 24px;">
        Войдите в свой аккаунт
    </p>

    <div style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 32px;">

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px;">Имя пользователя</label>
                <input type="text" name="username" required style="width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid #e5e7eb; background: #f9fafb; color: #111827; font-size: 14px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px;">Пароль</label>
                <input type="password" name="password" required style="width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid #e5e7eb; background: #f9fafb; color: #111827; font-size: 14px;">
            </div>

            {% if form.errors %}
                <div style="background: #fef2f2; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; color: #dc2626; font-size: 14px;">
                    Неверное имя пользователя или пароль
                </div>
            {% endif %}

            <button type="submit" style="display: inline-block; padding: 12px 30px; border-radius: 40px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s ease; background: #0284c7; color: #fff; width: 100%;">
                Войти
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px;">
            Нет аккаунта? <a href="{% url 'register' %}" style="color: #0284c7; text-decoration: none;">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
